<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BOB Solar - Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 20% 10%, #f59e0b22, #060606 50%);
        color: #fff;
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 1.5rem;
        border: 1px solid #ffffff1a;
        border-radius: 1rem;
        background: #ffffff08;
        backdrop-filter: blur(6px);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.4rem;
      }
      p {
        margin: 0;
        color: #d1d5db;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        BOB Solar cannot reach the network right now. Reconnect and refresh to
        continue syncing your latest data.
      </p>
    </main>
  </body>
</html>
